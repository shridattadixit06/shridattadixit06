<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Systems engineering orbit</title>
<desc id="desc">A dark technical illustration with a central systems core and orbital nodes for CPU, kernel, memory, network, and storage.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111c"/><stop offset="1" stop-color="#101c2d"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63e6be"/><stop offset="1" stop-color="#4dabf7"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#31506a" stroke-opacity=".24" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="440" rx="24" fill="url(#bg)"/>
<rect width="1200" height="440" rx="24" fill="url(#grid)"/>
<g fill="#a9c5d9" opacity=".65" font-family="monospace" font-size="11">
<text x="42" y="42">SYS.ARCH / 001</text><text x="1040" y="42">BOOT → EXEC → IO</text>
</g>
<g stroke="#63e6be" fill="none" opacity=".32">
<ellipse cx="600" cy="220" rx="330" ry="118" transform="rotate(-12 600 220)" stroke-width="1.5"/>
<ellipse cx="600" cy="220" rx="245" ry="88" transform="rotate(28 600 220)" stroke-dasharray="5 8"/>
<ellipse cx="600" cy="220" rx="160" ry="58" transform="rotate(-38 600 220)" stroke-dasharray="2 7"/>
</g>
<g fill="#63e6be" opacity=".75">
<circle cx="270" cy="170" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="930" cy="285" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="90" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
<g filter="url(#glow)">
<circle cx="600" cy="220" r="67" fill="#0b1b29" stroke="url(#core)" stroke-width="3"/>
<circle cx="600" cy="220" r="54" fill="none" stroke="#63e6be" stroke-opacity=".35" stroke-dasharray="3 6">
<animateTransform attributeName="transform" type="rotate" from="0 600 220" to="360 600 220" dur="28s" repeatCount="indefinite"/>
</circle>
</g>
<g fill="#e6fcf5" text-anchor="middle" font-family="monospace">
<text x="600" y="214" font-size="12" letter-spacing="3">SYSTEM</text><text x="600" y="235" font-size="20" font-weight="bold">CORE</text>
</g>
<g font-family="monospace" text-anchor="middle">
<g transform="translate(330 125)"><circle r="36" fill="#10283a" stroke="#4dabf7" stroke-width="2"/><text y="5" fill="#d0ebff" font-size="13">CPU</text><text y="55" fill="#8daec5" font-size="11">ARCHITECTURE</text></g>
<g transform="translate(850 135)"><circle r="36" fill="#10283a" stroke="#63e6be" stroke-width="2"/><text y="5" fill="#d3f9d8" font-size="13">KERNEL</text><text y="55" fill="#8daec5" font-size="11">PROCESSES</text></g>
<g transform="translate(390 320)"><circle r="36" fill="#10283a" stroke="#9775fa" stroke-width="2"/><text y="5" fill="#e5dbff" font-size="13">MEM</text><text y="55" fill="#8daec5" font-size="11">VIRTUAL MEMORY</text></g>
<g transform="translate(805 320)"><circle r="36" fill="#10283a" stroke="#ffa94d" stroke-width="2"/><text y="5" fill="#fff4e6" font-size="13">NET</text><text y="55" fill="#8daec5" font-size="11">TCP / IP</text></g>
</g>
<g fill="none" stroke="#63e6be" stroke-width="2" opacity=".7">
<path d="M366 135L536 195M814 145L664 195M420 300L552 254M770 300L648 254"/>
</g>
<g fill="#63e6be"><circle cx="536" cy="195" r="4"/><circle cx="664" cy="195" r="4"/><circle cx="552" cy="254" r="4"/><circle cx="648" cy="254" r="4"/></g>
<text x="600" y="410" text-anchor="middle" fill="#8daec5" font-family="monospace" font-size="12" letter-spacing="3">UNDERSTAND THE MACHINE · BUILD THE SYSTEM</text>
</svg>